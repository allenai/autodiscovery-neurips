[project]
name = "autodiscovery"
version = "0.1.0"
description = "Open-ended Scientific Discovery via Bayesian Surprise"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pip",
    "numpy>=1.21.0,<2.0",
    "pandas==1.5.3",
    "matplotlib==3.10",
    "IPython==8.26.0",
    "pyautogen[openai]==0.8",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "h5py",
    "boto3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
